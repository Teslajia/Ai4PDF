name: Windows Release

on:
  workflow_dispatch:
  push:
    tags: ['v*']

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          architecture: x64
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Validate tag
        shell: pwsh
        run: |
          $version = (Get-Content package.json -Raw | ConvertFrom-Json).version
          if ($env:GITHUB_REF_TYPE -eq 'tag' -and $env:GITHUB_REF_NAME -ne "v$version") { throw 'Tag must match package version' }
      - name: Build and verify installer
        shell: pwsh
        run: ./packaging/build.ps1
      - name: Verify install, upgrade and uninstall
        shell: pwsh
        run: ./packaging/test_installer.ps1
      - uses: actions/upload-artifact@v4
        with:
          name: Ai4PDF-Windows-Release
          path: release/*
          if-no-files-found: error
      - name: Create Release draft
        if: startsWith(github.ref, 'refs/tags/')
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view $env:GITHUB_REF_NAME --json tagName --jq .tagName 2>$null
          if ($LASTEXITCODE -eq 0) {
            Write-Host 'This release already exists. Its uploaded assets are preserved; the new build is available as an Actions artifact.'
            exit 0
          }
          $assets = Get-ChildItem release -File | ForEach-Object FullName
          gh release create $env:GITHUB_REF_NAME @assets --draft --verify-tag --title "Ai4PDF $env:GITHUB_REF_NAME" --notes-file packaging/release-notes.md
          if ($LASTEXITCODE -ne 0) { throw 'Release draft creation failed' }
